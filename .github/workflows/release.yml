name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run publish without pushing to npm or creating release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write  # Required for npm --provenance cryptographic attestation

jobs:
  publish:
    name: Build, Verify & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code with Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js & npm Registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Sync Package Version from Git Tag
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v(.*)$ ]]; then
            TAG_VERSION="${BASH_REMATCH[1]}"
            echo "Syncing package.json version to tag: $TAG_VERSION"
            npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          fi

      - name: Setup npm Authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set in GitHub repository secrets! Please add NPM_TOKEN to https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          echo "npm authentication configured successfully."

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Test Verification Gate
        run: bun test

      - name: Run Typecheck Gate
        run: bun run typecheck

      - name: Build Release Bundle
        run: bun run build

      - name: Build Docs Gate
        run: bun run docs:build

      - name: Pack Distribution Tarball
        id: pack
        run: |
          TARBALL=$(npm pack)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed tarball: $TARBALL"

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
        run: |
          echo "Publishing to npm with provenance..."
          npm publish --provenance --access public

      - name: Dry Run Publish Check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
        run: |
          echo "Dry run enabled. Skipping live publish."
          npm publish --provenance --access public --dry-run

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.tarball }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
